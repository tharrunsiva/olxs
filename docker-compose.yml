version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: reloop-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: reloop-backend
    restart: always
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017/reloop
      - JWT_SECRET=supersecretkey
      - PORT=5000

  frontend:
    build: ./frontend
    container_name: reloop-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
